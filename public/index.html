<!doctype html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zirkel</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="theme-color" content="#12141c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zirkel">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ================= LOGIN / SETUP ================= -->
<main id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="auth-mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35"/>
        <circle cx="24" cy="12" r="4" fill="currentColor"/>
        <circle cx="13" cy="31" r="4" fill="currentColor"/>
        <circle cx="35" cy="31" r="4" fill="currentColor"/>
        <path d="M24 16 L15 27.5 M24 16 L33 27.5 M17 31 H31" stroke="currentColor" stroke-width="1.6" opacity="0.6"/>
      </svg>
      <h1>Zirkel</h1>
    </div>
    <p class="auth-tagline">Nur für euch zwei.</p>

    <div id="auth-tabs" class="auth-tabs" hidden>
      <button type="button" class="auth-tab" data-tab="login">Anmelden</button>
      <button type="button" class="auth-tab" data-tab="register">Konto anlegen</button>
    </div>

    <form id="login-form" class="auth-form" autocomplete="on">
      <label class="field">
        <span>Benutzername</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Passwort</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <label class="check">
        <input type="checkbox" name="remember" checked>
        <span>Angemeldet bleiben (für schnellen Zugriff)</span>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Anmelden</button>
      <p class="auth-error" id="login-error" hidden></p>
    </form>

    <form id="register-form" class="auth-form" autocomplete="on" hidden>
      <p class="auth-hint" id="register-hint"></p>
      <label class="field">
        <span>Dein Anzeigename</span>
        <input type="text" name="displayName" autocomplete="name" required maxlength="60">
      </label>
      <label class="field">
        <span>Benutzername</span>
        <input type="text" name="username" autocomplete="username" required maxlength="40">
      </label>
      <label class="field">
        <span>Passwort (mind. 8 Zeichen)</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="8">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Konto anlegen</button>
      <p class="auth-error" id="register-error" hidden></p>
    </form>

    <p class="auth-footnote">Aus Datenschutzgründen ist ein Login nötig. Einmal angemeldet, bleibt ihr auf diesem Gerät angemeldet.</p>
  </div>
</main>

<!-- Die eigentliche App-Oberfläche wird erst nach erfolgreicher Anmeldung
     per JavaScript eingefügt (siehe app.js, ensureAppShell()) - so steht im
     ausgeloggten Zustand nichts über Zweck/Inhalt der App im HTML-Quelltext. -->

<script src="/vendor/d3.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
